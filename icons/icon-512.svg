<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D7A5F"/>
      <stop offset="100%" stop-color="#2D5A47"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner ring -->
  <rect x="20" y="20" width="472" height="472" rx="92" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- DW text -->
  <text x="256" y="276" text-anchor="middle" fill="white" font-size="170" font-family="Inter, -apple-system, sans-serif" font-weight="700" letter-spacing="-2">DW</text>
  <!-- Bottom accent line -->
  <rect x="146" y="316" width="220" height="10" rx="5" fill="rgba(255,255,255,0.35)"/>
</svg>
